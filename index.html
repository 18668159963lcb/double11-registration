  <style>

    .session-card { border-left: 3px solid; background: white; border-radius: 8px; padding: 16px; margin-bottom: 12px; }
    .dropdown-menu { max-height: 200px; overflow-y: auto; position: absolute; z-index: 50; width: 100%; background: white; border: 1px solid #d1d5db; border-radius: 8px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
    .dropdown-item:hover { background: #f3f4f6; }
    .toast { position: fixed; top: 20px; right: 20px; z-index: 9999; padding: 12px 24px; border-radius: 8px; color: white; font-weight: 500; animation: slideIn 0.3s ease; }
    @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
  </style>
</head>
<body class="bg-gray-100 min-h-screen">
  <div id="app"></div>

  <script>
    // ==================== CONFIG ====================
    const WEBHOOK_URL = 'PASTE_YOUR_WEBHOOK_URL_HERE';

    // ==================== DATA CONSTANTS ====================

      '宁夏回族自治区': ['银川', '石嘴山', '吴忠', '固原', '中卫'],
      '新疆维吾尔自治区': ['乌鲁木齐', '克拉玛依', '吐鲁番', '哈密', '库尔勒', '阿克苏'],
      '西藏自治区': ['拉萨', '日喀则', '昌都', '林芝'],
      '广西壮族自治区': ['南宁', '柳州', '桂林', '梧州', '北海', '玉林', '百色'],
      '海南省': ['海口', '三亚', '儋州', '琼海', '文昌'],
      '贵州省': ['贵阳', '遵义', '六盘水', '安顺', '毕节', '铜仁'],
      '云南省': ['昆明', '曲靖', '大理', '玉溪', '红河', '楚雄', '文山']
    };

    var EVENT_CARDS = [
      {
        date: '2026年09月15日', location: '杭州阿里巴巴西溪园区',
        events: [
          { icon: '\uD83D\uDC54', name: '服饰主会场', time: '09:30-12:30', venue: 'B区报告厅', checkin: '08:30签到', color: '#1677FF' },
          { icon: '\uD83D\uDC57', name: '女装商家大会', time: '14:00-17:30', venue: 'B区报告厅', checkin: '13:00签到', color: '#EB2F96' },
          { icon: '\uD83D\uDC5F', name: '男女鞋商家大会', time: '14:00-16:30', venue: 'B区多功能厅', checkin: '13:00签到', color: '#FA8C16' },
          { icon: '\uD83C\uDFF7\uFE0F', name: '内衣商家大会', time: '14:00-17:30', venue: 'A区报告厅', checkin: '13:00签到', color: '#13C2C2' },
          { icon: '\uD83D\uDC5C', name: '箱包服配商家大会', time: '14:00-17:30', venue: 'C区望江南报告厅', checkin: '13:00签到', color: '#52C41A' }
        ]
      },
      {
        date: '2026年09月16日', location: '杭州阿里巴巴西溪园区',
        events: [
          { icon: '\uD83E\uDDE5', name: '男装商家大会', time: '09:30-12:30', venue: 'A区报告厅', checkin: '08:30签到', color: '#722ED1' }
        ]
      }
    ];

    // ==================== STATE ====================
    var _mySubmissions = JSON.parse(localStorage.getItem('mySubmissions') || '[]');

    // ==================== UTILS ====================
    function showToast(msg, type) {
      var toast = document.createElement('div');
      toast.className = 'toast';
      toast.style.background = type === 'error' ? '#ff4d4f' : '#52c41a';
      toast.textContent = msg;
      document.body.appendChild(toast);
      setTimeout(function() { toast.remove(); }, 3000);
    }

    function getNowStr() {
      var d = new Date();
      var pad = function(n) { return n < 10 ? '0' + n : '' + n; };
      return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' +
             pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
    }

    // ==================== RENDER ====================
    function render() {
      var app = document.getElementById('app');
      app.innerHTML =
        '<div class="max-w-3xl mx-auto py-8 px-4">' +
          '<div class="bg-white rounded-2xl shadow-sm p-8 mb-6">' +
            '<h1 class="text-2xl font-bold text-center text-gray-800 mb-2">2026双11大会 · 大客商家参会登记</h1>' +
            '<p class="text-center text-gray-500 mb-8">请如实填写以下信息，每个商家可批量登记多位参会嘉宾</p>' +
            '<div id="formContent">' + renderFormFields() + '</div>' +
          '</div>' +
          renderSessionInfo() +
          renderMySubmissions() +
        '</div>';
      initFormEvents();
    }

    function renderFormFields() {
      return '' +
        '<div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">' +
          '<div>' +
            '<label class="block text-sm font-medium text-gray-700 mb-1">商家名称 <span class="text-red-500">*</span></label>' +
            '<input id="merchant" type="text" placeholder="请输入商家名称" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none">' +
          '</div>' +
          '<div>' +
            '<label class="block text-sm font-medium text-gray-700 mb-1">对接小二 <span class="text-red-500">*</span></label>' +
            '<input id="xiaoer" type="text" placeholder="请输入对接小二花名" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none">' +
          '</div>' +
        '</div>' +
        '<div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">' +
          '<div class="relative">' +
            '<label class="block text-sm font-medium text-gray-700 mb-1">来源省 <span class="text-red-500">*</span></label>' +
            '<input id="province" type="text" placeholder="请选择省份" autocomplete="off" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none">' +
            '<div id="provinceDropdown" class="dropdown-menu hidden"></div>' +
          '</div>' +
          '<div class="relative">' +
            '<label class="block text-sm font-medium text-gray-700 mb-1">来源市 <span class="text-red-500">*</span></label>' +
            '<input id="city" type="text" placeholder="请选择城市" autocomplete="off" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none" disabled>' +
            '<div id="cityDropdown" class="dropdown-menu hidden"></div>' +
          '</div>' +
        '</div>' +
        '<div class="mb-4">' +
          '<label class="block text-sm font-medium text-gray-700 mb-2">参会场次 <span class="text-red-500">*</span></label>' +
          '<div id="sessionTags" class="flex flex-wrap gap-2">' +
            SESSIONS_LIST.map(function(s) {
              return '<span class="session-tag px-3 py-1.5 border border-gray-300 rounded-full text-sm cursor-pointer hover:border-blue-400 transition" data-value="' + s + '">' + s + '</span>';
            }).join('') +
          '</div>' +
        '</div>' +
        '<div class="mb-6">' +
          '<label class="block text-sm font-medium text-gray-700 mb-2">参会嘉宾 <span class="text-red-500">*</span></label>' +
          '<div id="guestRows">' + renderGuestRow(1) + '</div>' +
          '<button id="addGuestBtn" class="mt-3 text-blue-500 text-sm font-medium hover:text-blue-700">' +
            '<i class="fas fa-plus mr-1"></i>添加嘉宾（还可添加 <span id="remainingCount">9</span> 位）' +
          '</button>' +
        '</div>' +
        '<button id="submitBtn" class="w-full py-3 bg-blue-500 hover:bg-blue-600 text-white font-semibold rounded-lg transition">提交登记</button>';
    }

    function renderGuestRow(num) {
      var delDisabled = num === 1 ? ' opacity-30 cursor-not-allowed" disabled' : '"';
      return '' +
        '<div class="guest-row flex items-center gap-3 mb-3 p-3 bg-gray-50 rounded-lg" data-num="' + num + '">' +
          '<span class="text-gray-400 font-bold text-lg w-6 text-center">' + num + '</span>' +
          '<input type="text" placeholder="姓名" class="guest-name flex-1 px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none">' +
          '<input type="text" placeholder="职务/Title" class="guest-title flex-1 px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none">' +
          '<input type="tel" placeholder="手机号" class="guest-phone flex-1 px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none" maxlength="11">' +
          '<button class="delete-guest text-red-400 hover:text-red-600 text-xl font-bold w-8 h-8 flex items-center justify-center' + delDisabled + '>\u00d7</button>' +
        '</div>';
    }

    function renderSessionInfo() {
      var html = '<div class="bg-white rounded-2xl shadow-sm p-8 mb-6">' +
        '<h2 class="text-xl font-bold text-gray-800 mb-6"><i class="fas fa-calendar-alt mr-2 text-blue-500"></i>会议场次信息</h2>';
      EVENT_CARDS.forEach(function(day) {
        html += '<div class="mb-6"><h3 class="font-semibold text-gray-700 mb-3"><i class="far fa-calendar mr-1"></i>' + day.date + '（' + day.location + '）</h3>';
        day.events.forEach(function(ev) {
          html += '' +
            '<div class="session-card" style="border-left-color: ' + ev.color + '">' +
              '<div class="flex items-center justify-between flex-wrap gap-2">' +
                '<div class="flex items-center gap-3">' +
                  '<span class="text-2xl">' + ev.icon + '</span>' +
                  '<div>' +
                    '<div class="font-semibold text-gray-800">' + ev.name + '</div>' +
                    '<div class="text-sm text-gray-500 mt-1"><i class="far fa-clock mr-1"></i>' + ev.time + ' · ' + ev.venue + '</div>' +
                  '</div>' +
                '</div>' +
                '<span class="px-3 py-1 rounded-full text-xs font-medium" style="background: ' + ev.color + '20; color: ' + ev.color + '">' + ev.checkin + '</span>' +
              '</div>' +
            '</div>';
        });
        html += '</div>';
      });
      html += '</div>';
      return html;
    }

    function renderMySubmissions() {
      if (_mySubmissions.length === 0) return '';
      var grouped = {};
      _mySubmissions.forEach(function(sub) {
        if (!grouped[sub.merchant]) grouped[sub.merchant] = [];
        grouped[sub.merchant].push(sub);
      });
      var html = '<div class="bg-white rounded-2xl shadow-sm p-8 mb-6">' +
        '<h2 class="text-xl font-bold text-gray-800 mb-4"><i class="fas fa-check-circle mr-2 text-green-500"></i>我的提交记录</h2>';
      Object.keys(grouped).forEach(function(merchant) {
        var recs = grouped[merchant];
        html += '<div class="mb-4 p-4 bg-blue-50 rounded-lg">' +
          '<h4 class="font-semibold text-blue-800 mb-2">' + merchant + '</h4>' +
          '<p class="text-xs text-gray-500 mb-2">场次：' + recs[0].sessions + '</p>' +
          '<p class="text-xs text-gray-400 mb-2">提交时间：' + recs[0].submit_time + '</p>' +
          '<div class="overflow-x-auto"><table class="w-full text-sm"><thead><tr class="text-left text-gray-500">' +
          '<th class="pb-1">姓名</th><th class="pb-1">职务</th><th class="pb-1">手机号</th></tr></thead><tbody>';
        recs.forEach(function(r) {
          html += '<tr><td class="py-1">' + r.guest_name + '</td><td>' + (r.guest_title || '-') + '</td><td>' + (r.phone || '-') + '</td></tr>';
        });
        html += '</tbody></table></div></div>';
      });
      html += '</div>';
      return html;
    }

    // ==================== FORM EVENTS ====================
    function initFormEvents() {
      var provinceInput = document.getElementById('province');
      var provinceDD = document.getElementById('provinceDropdown');
      var cityInput = document.getElementById('city');
      var cityDD = document.getElementById('cityDropdown');

      if (!provinceInput) return;

      provinceInput.addEventListener('focus', function() {
        showDropdown(provinceDD, Object.keys(PROVINCES_CITIES), provinceInput, 'province');
      });
      provinceInput.addEventListener('input', function() {
        var filtered = Object.keys(PROVINCES_CITIES).filter(function(p) {
          return p.indexOf(provinceInput.value) !== -1;
        });
        showDropdown(provinceDD, filtered, provinceInput, 'province');
      });

      cityInput.addEventListener('focus', function() {
        var prov = provinceInput.value;
        if (PROVINCES_CITIES[prov]) {
          showDropdown(cityDD, PROVINCES_CITIES[prov], cityInput, 'city');
        }
      });
      cityInput.addEventListener('input', function() {
        var prov = provinceInput.value;
        if (PROVINCES_CITIES[prov]) {
          var filtered = PROVINCES_CITIES[prov].filter(function(c) {
            return c.indexOf(cityInput.value) !== -1;
          });
          showDropdown(cityDD, filtered, cityInput, 'city');
        }
      });

      document.addEventListener('click', function(e) {
        if (!e.target.closest('#province') && !e.target.closest('#provinceDropdown')) {
          provinceDD.classList.add('hidden');
        }
        if (!e.target.closest('#city') && !e.target.closest('#cityDropdown')) {
          cityDD.classList.add('hidden');
        }
      });

      var tags = document.querySelectorAll('.session-tag');
      tags.forEach(function(tag) {
        tag.addEventListener('click', function() {
          tag.classList.toggle('tag-selected');
        });
      });

      var addBtn = document.getElementById('addGuestBtn');
      if (addBtn) {
        addBtn.addEventListener('click', function() {
          var rows = document.querySelectorAll('.guest-row');
          if (rows.length >= 10) {
            showToast('最多添加10位嘉宾', 'error');
            return;
          }
          var num = rows.length + 1;
          document.getElementById('guestRows').insertAdjacentHTML('beforeend', renderGuestRow(num));
          updateGuestControls();
        });
      }

      var guestRowsContainer = document.getElementById('guestRows');
      if (guestRowsContainer) {
        guestRowsContainer.addEventListener('click', function(e) {
          if (e.target.classList.contains('delete-guest') && !e.target.disabled) {
            e.target.closest('.guest-row').remove();
            renumberGuests();
          }
        });
      }

      var submitBtn = document.getElementById('submitBtn');
      if (submitBtn) {
        submitBtn.addEventListener('click', handleSubmit);
      }
    }

    function showDropdown(dropdown, items, input, type) {
      dropdown.innerHTML = items.map(function(item) {
        return '<div class="dropdown-item px-4 py-2 cursor-pointer text-sm" data-value="' + item + '">' + item + '</div>';
      }).join('');
      dropdown.classList.remove('hidden');
      dropdown.querySelectorAll('.dropdown-item').forEach(function(el) {
        el.addEventListener('click', function() {
          input.value = el.dataset.value;
          dropdown.classList.add('hidden');
          if (type === 'province') {
            document.getElementById('city').value = '';
            document.getElementById('city').disabled = false;
          }
        });
      });
    }

    function updateGuestControls() {
      var count = document.querySelectorAll('.guest-row').length;
      var remaining = document.getElementById('remainingCount');
      if (remaining) remaining.textContent = 10 - count;
      var addBtn = document.getElementById('addGuestBtn');
      if (addBtn && count >= 10) {
        addBtn.classList.add('opacity-50', 'cursor-not-allowed');
      } else if (addBtn) {
        addBtn.classList.remove('opacity-50', 'cursor-not-allowed');
      }
    }

    function renumberGuests() {
      document.querySelectorAll('.guest-row').forEach(function(row, i) {
        row.dataset.num = i + 1;
        row.querySelector('span').textContent = i + 1;
        var delBtn = row.querySelector('.delete-guest');
        if (i === 0) {
          delBtn.disabled = true;
          delBtn.classList.add('opacity-30', 'cursor-not-allowed');
        } else {
          delBtn.disabled = false;
          delBtn.classList.remove('opacity-30', 'cursor-not-allowed');
        }
      });
      updateGuestControls();
    }

    // ==================== SUBMIT ====================
    function handleSubmit() {
      var merchant = document.getElementById('merchant').value.trim();
      var xiaoer = document.getElementById('xiaoer').value.trim();
      var province = document.getElementById('province').value.trim();
      var city = document.getElementById('city').value.trim();
      var selectedSessions = [];
      document.querySelectorAll('.session-tag.tag-selected').forEach(function(el) {
        selectedSessions.push(el.dataset.value);
      });

      if (!merchant) { showToast('请输入商家名称', 'error'); return; }
      if (!xiaoer) { showToast('请输入对接小二', 'error'); return; }
      if (!province) { showToast('请选择省份', 'error'); return; }
      if (!city) { showToast('请选择城市', 'error'); return; }
      if (selectedSessions.length === 0) { showToast('请选择至少一个参会场次', 'error'); return; }

      var guests = [];
      var valid = true;
      document.querySelectorAll('.guest-row').forEach(function(row) {
        var name = row.querySelector('.guest-name').value.trim();
        var title = row.querySelector('.guest-title').value.trim();
        var phone = row.querySelector('.guest-phone').value.trim();
        if (!name) { valid = false; return; }
        if (!phone || !/^1\d{10}$/.test(phone)) { valid = false; return; }
        guests.push({ guest_name: name, guest_title: title, phone: phone });
      });

      if (!valid) {
        showToast('请完整填写嘉宾信息（姓名和正确手机号必填）', 'error');
        return;
      }

      var sessionsStr = selectedSessions.join(', ');
      var submitTime = getNowStr();

      // Fire-and-forget: send one POST per guest row
      guests.forEach(function(g) {
        var payload = {
          merchant: merchant,
          xiaoer: xiaoer,
          province: province,
          city: city,
          sessions: sessionsStr,
          guest_name: g.guest_name,
          guest_title: g.guest_title,
          phone: g.phone,
          submit_time: submitTime
        };
        try {
          fetch(WEBHOOK_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload),
            mode: 'no-cors'
          }).catch(function() {});
        } catch (e) { /* silent */ }
      });

      // Save to localStorage for "my submissions" tracking
      var newEntries = guests.map(function(g) {
        return {
          merchant: merchant,
          xiaoer: xiaoer,
          province: province,
          city: city,
          sessions: sessionsStr,
          guest_name: g.guest_name,
          guest_title: g.guest_title,
          phone: g.phone,
          submit_time: submitTime
        };
      });

      _mySubmissions = _mySubmissions.concat(newEntries);
      localStorage.setItem('mySubmissions', JSON.stringify(_mySubmissions));

      showToast('成功登记 ' + guests.length + ' 位嘉宾！');

      // Re-render to show updated submissions
      render();
    }

    // ==================== INIT ====================
    function startApp() {
      render();
    }
    window.addEventListener('DOMContentLoaded', startApp);
  </script>
</body>
</html>
