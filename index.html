    async function loadFromCloud() {
      try {
        const { data, error } = await supabase.from('registrations').select('*').order('created_at', { ascending: false });
        if (error) throw error;
        _recordCache = data || [];
        localStorage.setItem('recordCache', JSON.stringify(_recordCache));
        return _recordCache;
      } catch (e) {
        console.error('Cloud load failed:', e);
        _recordCache = JSON.parse(localStorage.getItem('recordCache') || '[]');
        return _recordCache;
      }
    }

    function getRecords() { return _recordCache; }

    async function cloudInsert(record) {
      try {
        const { data, error } = await supabase.from('registrations').insert(record).select();
        if (error) throw error;
        return data;
      } catch (e) { console.error('Insert failed:', e); }
    }

    async function cloudUpdate(id, updates) {
      try {
        const { error } = await supabase.from('registrations').update(updates).eq('id', id);
        if (error) throw error;
      } catch (e) { console.error('Update failed:', e); }
    }

    async function cloudDelete(id) {

        const { error } = await supabase.from('registrations').delete().eq('id', id);

      const toast = document.createElement('div');
      toast.className = 'toast';
      toast.style.background = type === 'success' ? '#52c41a' : type === 'error' ? '#ff4d4f' : '#1677ff';
      toast.textContent = msg;
      document.body.appendChild(toast);
      setTimeout(() => toast.remove(), 3000);
    }

    function showConfirm(msg, onOk) {
      const overlay = document.createElement('div');
      overlay.className = 'modal-overlay';
      overlay.innerHTML = `
        <div class="bg-white rounded-xl p-6 max-w-sm w-full mx-4 shadow-2xl">
          <p class="text-gray-800 text-center mb-6">${msg}</p>
          <div class="flex gap-3 justify-center">
            <button id="confirmCancel" class="px-6 py-2 bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200">取消</button>
            <button id="confirmOk" class="px-6 py-2 bg-red-500 text-white rounded-lg hover:bg-red-600">确定</button>
          </div>
        </div>`;
      document.body.appendChild(overlay);
      overlay.querySelector('#confirmCancel').onclick = () => overlay.remove();
      overlay.querySelector('#confirmOk').onclick = () => { overlay.remove(); onOk(); };
    }

    function renderSessionInfo() {
      let html = '<div class="bg-white rounded-2xl shadow-sm p-8 mb-6"><h2 class="text-xl font-bold text-gray-800 mb-6"><i class="fas fa-calendar-alt mr-2 text-blue-500"></i>会议场次信息</h2>';

          html += `

    function renderMySubmissions() {
      if (_mySubmissionIds.length === 0) return '';
      const records = getRecords().filter(r => _mySubmissionIds.includes(r.id));
      if (records.length === 0) return '';
      const grouped = {};
      records.forEach(r => {
        if (!grouped[r.merchant]) grouped[r.merchant] = [];
        grouped[r.merchant].push(r);
      });
      let html = '<div class="bg-white rounded-2xl shadow-sm p-8 mb-6"><h2 class="text-xl font-bold text-gray-800 mb-4"><i class="fas fa-check-circle mr-2 text-green-500"></i>我的提交记录</h2>';
      Object.entries(grouped).forEach(([merchant, recs]) => {
        html += `<div class="mb-4 p-4 bg-blue-50 rounded-lg"><h4 class="font-semibold text-blue-800 mb-2">${merchant}</h4>`;
        html += `<p class="text-xs text-gray-500 mb-2">场次：${(recs[0].sessions || []).join('、')}</p>`;
        html += '<div class="overflow-x-auto"><table class="w-full text-sm"><thead><tr class="text-left text-gray-500"><th class="pb-1">姓名</th><th class="pb-1">职务</th><th class="pb-1">手机号</th></tr></thead><tbody>';
        recs.forEach(r => {
          html += `<tr><td class="py-1">${r.guest_name}</td><td>${r.guest_title || '-'}</td><td>${r.phone || '-'}</td></tr>`;
        });
        html += '</tbody></table></div></div>';
      });
      html += '</div>';
      return html;
    }

    function initFormEvents() {
      // Province dropdown
      const provinceInput = document.getElementById('province');
      const provinceDD = document.getElementById('provinceDropdown');
      const cityInput = document.getElementById('city');
      const cityDD = document.getElementById('cityDropdown');

      if (!provinceInput) return;

      provinceInput.addEventListener('focus', () => showDropdown(provinceDD, Object.keys(PROVINCES_CITIES), provinceInput, 'province'));
      provinceInput.addEventListener('input', () => {
        const filtered = Object.keys(PROVINCES_CITIES).filter(p => p.includes(provinceInput.value));
        showDropdown(provinceDD, filtered, provinceInput, 'province');
      });

      cityInput.addEventListener('focus', () => {
        const prov = provinceInput.value;
        if (PROVINCES_CITIES[prov]) showDropdown(cityDD, PROVINCES_CITIES[prov], cityInput, 'city');
      });
      cityInput.addEventListener('input', () => {
        const prov = provinceInput.value;
        if (PROVINCES_CITIES[prov]) {
          const filtered = PROVINCES_CITIES[prov].filter(c => c.includes(cityInput.value));
          showDropdown(cityDD, filtered, cityInput, 'city');
        }
      });

      document.addEventListener('click', (e) => {
        if (!e.target.closest('#province') && !e.target.closest('#provinceDropdown')) provinceDD.classList.add('hidden');
        if (!e.target.closest('#city') && !e.target.closest('#cityDropdown')) cityDD.classList.add('hidden');
      });

      // Session tags
      document.querySelectorAll('.session-tag').forEach(tag => {
        tag.addEventListener('click', () => tag.classList.toggle('tag-selected'));
      });

      // Add guest
      const addBtn = document.getElementById('addGuestBtn');
      if (addBtn) {
        addBtn.addEventListener('click', () => {
          const rows = document.querySelectorAll('.guest-row');
          if (rows.length >= 10) return showToast('最多添加10位嘉宾', 'error');
          const num = rows.length + 1;
          document.getElementById('guestRows').insertAdjacentHTML('beforeend', renderGuestRow(num));
          updateGuestControls();
        });
      }

      // Delete guest delegation
      document.getElementById('guestRows')?.addEventListener('click', (e) => {
        if (e.target.classList.contains('delete-guest') && !e.target.disabled) {
          e.target.closest('.guest-row').remove();
          renumberGuests();
        }
      });

      // Submit
      document.getElementById('submitBtn')?.addEventListener('click', handleSubmit);
    }

    function showDropdown(dropdown, items, input, type) {
      dropdown.innerHTML = items.map(item => `<div class="dropdown-item px-4 py-2 cursor-pointer text-sm" data-value="${item}">${item}</div>`).join('');
      dropdown.classList.remove('hidden');
      dropdown.querySelectorAll('.dropdown-item').forEach(el => {
        el.addEventListener('click', () => {
          input.value = el.dataset.value;
          dropdown.classList.add('hidden');
          if (type === 'province') {
            document.getElementById('city').value = '';
            document.getElementById('city').disabled = false;
          }
        });
      });
    }

    function updateGuestControls() {
      const count = document.querySelectorAll('.guest-row').length;
      const remaining = document.getElementById('remainingCount');
      if (remaining) remaining.textContent = 10 - count;
      const addBtn = document.getElementById('addGuestBtn');
      if (addBtn && count >= 10) addBtn.classList.add('opacity-50', 'cursor-not-allowed');
      else if (addBtn) addBtn.classList.remove('opacity-50', 'cursor-not-allowed');
    }

    function renumberGuests() {
      document.querySelectorAll('.guest-row').forEach((row, i) => {
        row.dataset.num = i + 1;
        row.querySelector('span').textContent = i + 1;
        const delBtn = row.querySelector('.delete-guest');
        if (i === 0) { delBtn.disabled = true; delBtn.classList.add('opacity-30', 'cursor-not-allowed'); }
        else { delBtn.disabled = false; delBtn.classList.remove('opacity-30', 'cursor-not-allowed'); }
      });
      updateGuestControls();
    }

    async function handleSubmit() {
      if (_cutoff) return showToast('已截单，无法提交', 'error');
      const merchant = document.getElementById('merchant').value.trim();
      const xiaoer = document.getElementById('xiaoer').value.trim();
      const province = document.getElementById('province').value.trim();
      const city = document.getElementById('city').value.trim();
      const selectedSessions = [...document.querySelectorAll('.session-tag.tag-selected')].map(el => el.dataset.value);

      if (!merchant) return showToast('请输入商家名称', 'error');
      if (!xiaoer) return showToast('请输入对接小二', 'error');
      if (!province) return showToast('请选择省份', 'error');
      if (!city) return showToast('请选择城市', 'error');
      if (selectedSessions.length === 0) return showToast('请选择至少一个参会场次', 'error');

      const guests = [];
      let valid = true;
      document.querySelectorAll('.guest-row').forEach(row => {
        const name = row.querySelector('.guest-name').value.trim();
        const title = row.querySelector('.guest-title').value.trim();
        const phone = row.querySelector('.guest-phone').value.trim();
        if (!name) { valid = false; return; }
        if (!phone || !/^1\d{10}$/.test(phone)) { valid = false; return; }
        guests.push({ guest_name: name, guest_title: title, phone });
      });
      if (!valid) return showToast('请完整填写嘉宾信息（姓名和正确手机号必填）', 'error');

      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.textContent = '提交中...';

      const insertedIds = [];
      try {
        for (const g of guests) {
          const record = {
            merchant, xiaoer, province, city,
            sessions: selectedSessions,
            guest_name: g.guest_name,
            guest_title: g.guest_title,
            phone: g.phone
          };
          const result = await cloudInsert(record);
          if (result && result[0]) {
            _recordCache.unshift(result[0]);
            insertedIds.push(result[0].id);
          }
        }
        _mySubmissionIds = [..._mySubmissionIds, ...insertedIds];
        localStorage.setItem('mySubmissionIds', JSON.stringify(_mySubmissionIds));
        localStorage.setItem('recordCache', JSON.stringify(_recordCache));
        showToast(`成功登记 ${guests.length} 位嘉宾！`);
        render(document.getElementById('app'));
      } catch (e) {
        showToast('提交失败，请重试', 'error');
        btn.disabled = false;
        btn.textContent = '提交登记';
      }
    }

    function renderSessionChart() {
      const records = getRecords();
      const counts = {};
      SESSIONS_LIST.forEach(s => counts[s] = 0);

      if (charts.session) charts.session.destroy();
      const ctx = document.getElementById('sessionChart');
      if (!ctx) return;
      charts.session = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: SESSIONS_LIST.map(s => s.split(' ')[0]),
          datasets: [{ label: '登记人数', data: Object.values(counts), backgroundColor: '#1677FF', borderRadius: 6 }]
        },
        options: { responsive: true, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } } }
      });
    }

    function renderProvinceChart() {
      const records = getRecords();
      const counts = {};
      records.forEach(r => { if (r.province) counts[r.province] = (counts[r.province] || 0) + 1; });
      const sorted = Object.entries(counts).sort((a, b) => b[1] - a[1]).slice(0, 8);
      if (charts.province) charts.province.destroy();
      const ctx = document.getElementById('provinceChart');
      if (!ctx) return;
      const colors = ['#1677FF', '#52C41A', '#FA8C16', '#722ED1', '#EB2F96', '#13C2C2', '#F5222D', '#FAAD14'];
      charts.province = new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: sorted.map(s => s[0]),
          datasets: [{ data: sorted.map(s => s[1]), backgroundColor: colors }]
        },
        options: { responsive: true, plugins: { legend: { position: 'right' } } }
      });
    }

      const records = getRecords();

      records.forEach(r => {
        (r.sessions || []).forEach(s => {

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
          ${SESSIONS_LIST.map((s, idx) => {
            const d = sessionData[s];
            const color = sessionColors[idx] || '#1677FF';
            return `
              <div class="bg-white rounded-xl shadow-sm p-6 border-t-4" style="border-top-color: ${color}">
                <h3 class="font-semibold text-gray-800 mb-3">${s}</h3>
                <div class="flex gap-6 mb-4">
                  <div class="text-center"><div class="text-3xl font-bold" style="color: ${color}">${d.people.length}</div><div class="text-xs text-gray-500">登记人数</div></div>
                  <div class="text-center"><div class="text-3xl font-bold text-green-600">${d.merchants.size}</div><div class="text-xs text-gray-500">商家数</div></div>
                </div>
                <div class="border-t pt-3">
                  <div class="text-xs text-gray-500 mb-2">参会商家：</div>
                  <div class="text-xs text-gray-600 max-h-32 overflow-y-auto">
                    ${d.merchants.size === 0 ? '<span class="text-gray-400">暂无</span>' : [...d.merchants].map(m => `<span class="inline-block px-2 py-0.5 bg-gray-100 rounded mr-1 mb-1">${m}</span>`).join('')}
                  </div>
                </div>
              </div>`;
          }).join('')}
        </div>`;
    }

    // ---- Settings ----
    function renderSettings(container) {
      container.innerHTML = `
        <div class="max-w-xl mx-auto space-y-6">
          <div class="bg-white rounded-xl shadow-sm p-6">
            <h3 class="font-semibold text-gray-800 mb-4"><i class="fas fa-key mr-2 text-yellow-500"></i>修改密码</h3>
            <div class="flex gap-3">
              <input id="newPwd" type="password" placeholder="新密码" class="flex-1 px-4 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none">
              <button id="changePwdBtn" class="px-4 py-2 bg-blue-500 text-white rounded-lg text-sm hover:bg-blue-600">保存</button>
            </div>
          </div>
          <div class="bg-white rounded-xl shadow-sm p-6">
            <h3 class="font-semibold text-gray-800 mb-4"><i class="fas fa-database mr-2 text-green-500"></i>数据备份</h3>
            <div class="flex gap-3 flex-wrap">
              <button id="exportJsonBtn" class="px-4 py-2 bg-green-500 text-white rounded-lg text-sm hover:bg-green-600"><i class="fas fa-download mr-1"></i>导出JSON</button>
              <label class="px-4 py-2 bg-blue-500 text-white rounded-lg text-sm cursor-pointer hover:bg-blue-600"><i class="fas fa-upload mr-1"></i>导入JSON<input type="file" id="importJson" accept=".json" class="hidden"></label>
            </div>
          </div>
          <div class="bg-white rounded-xl shadow-sm p-6 border border-red-100">
            <h3 class="font-semibold text-red-500 mb-4"><i class="fas fa-exclamation-triangle mr-2"></i>危险操作</h3>
            <p class="text-sm text-gray-500 mb-3">清空所有记录将从数据库中永久删除所有数据，此操作不可撤销。</p>
            <button id="clearAllBtn" class="px-4 py-2 bg-red-500 text-white rounded-lg text-sm hover:bg-red-600"><i class="fas fa-trash mr-1"></i>清空所有记录</button>
          </div>
        </div>`;

      document.getElementById('changePwdBtn').addEventListener('click', () => {
        const pwd = document.getElementById('newPwd').value.trim();
        if (!pwd) return showToast('请输入新密码', 'error');
        localStorage.setItem('adminPassword', pwd);
        showToast('密码已更新');
      });

      document.getElementById('exportJsonBtn').addEventListener('click', () => {
        const blob = new Blob([JSON.stringify(getRecords(), null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = `registrations_backup_${new Date().toISOString().split('T')[0]}.json`;
        a.click(); URL.revokeObjectURL(url);
        showToast('导出成功');
      });

      document.getElementById('importJson').addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const text = await file.text();
        try {
          const data = JSON.parse(text);
          if (!Array.isArray(data)) throw new Error('Invalid format');
          let count = 0;
          for (const record of data) {
            const { id, created_at, updated_at, ...rest } = record;
            const result = await cloudInsert(rest);
            if (result) count++;
          }
          await loadFromCloud();
          showToast(`成功导入 ${count} 条记录`);
          switchAdminTab('overview');
        } catch (err) {
          showToast('导入失败: ' + err.message, 'error');
        }
      });

      document.getElementById('clearAllBtn').addEventListener('click', () => {
        showConfirm('确定清空所有记录？此操作不可撤销！', async () => {
          const records = getRecords();
          for (const r of records) { await cloudDelete(r.id); }
          _recordCache = [];
          localStorage.setItem('recordCache', '[]');
          showToast('已清空所有记录');
          switchAdminTab('overview');
        });
      });
    }

    // ==================== INIT ====================
    console.log('=== Init section reached ===');
    async function startApp() {
      console.log('=== startApp called ===');
      await loadFromCloud();
      console.log('=== Cloud loaded, rendering ===');
      render();
      console.log('=== Render complete, app length: ' + document.getElementById('app').innerHTML.length + ' ===');
    }
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      console.log('=== DOM ready, starting app ===');
      startApp();
    } else {
      console.log('=== Waiting for DOMContentLoaded ===');
      window.addEventListener('DOMContentLoaded', startApp);
    }
    window.addEventListener('hashchange', render);
  </script>
</body>
</html>
